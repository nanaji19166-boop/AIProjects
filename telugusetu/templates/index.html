<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeluguSetu</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:680px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001}.drop{border:2px dashed #7b8190;border-radius:16px;padding:42px 15px;text-align:center;word-break:break-word}button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:14px;font-size:16px}.primary{background:#182230;color:white}.secondary{background:#e9edf3;color:#172033}.hidden{display:none}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.progress{height:10px;background:#e7eaf0;border-radius:10px;margin-top:14px;overflow:hidden}.bar{height:100%;width:0;background:#182230;transition:width .3s}.small{font-size:13px;color:#667085}</style></head><body><main><div class="card"><h1>🇮🇳 TeluguSetu</h1><p>English PDF → Telugu PDF / DOCX</p><div class="drop" id="drop">Tap to select PDF<input id="file" type="file" accept=".pdf" hidden></div><button class="primary" id="analyze">Analyze PDF</button><section id="result" class="hidden"><h3>Analysis</h3><div id="stats"></div><button class="primary" id="translate">Translate to Telugu</button><div class="progress"><div class="bar" id="bar"></div></div><div id="status"></div><div class="small">Keep this page open while translation is running.</div><div id="downloads"></div></section></div></main><script>let selected=null,job=null,poll=null;const file=document.querySelector("#file"),drop=document.querySelector("#drop"),result=document.querySelector("#result"),stats=document.querySelector("#stats"),status=document.querySelector("#status"),translate=document.querySelector("#translate"),bar=document.querySelector("#bar"),downloads=document.querySelector("#downloads");drop.onclick=()=>file.click();file.onchange=()=>{selected=file.files[0];drop.textContent=selected?selected.name:"Tap to select PDF"};document.querySelector("#analyze").onclick=async()=>{if(!selected)return alert("Select a PDF first.");const fd=new FormData();fd.append("file",selected);status.textContent="Analyzing…";try{const r=await fetch("/analyze",{method:"POST",body:fd}),d=await r.json();if(!r.ok)throw Error(d.error||"Analysis failed");job=d.job_id;stats.innerHTML=Object.entries(d).filter(([k])=>k!=="job_id").map(([k,v])=>'<div class="stat"><b>'+k.replaceAll("_"," ")+'</b><span>'+v+"</span></div>").join("");result.classList.remove("hidden");status.textContent="Analysis complete."}catch(e){status.textContent=e.message}};translate.onclick=async()=>{if(!job)return;translate.disabled=true;downloads.innerHTML="";bar.style.width="0%";status.textContent="Starting translation…";try{const fd=new FormData();fd.append("job_id",job);const r=await fetch("/translate",{method:"POST",body:fd}),d=await r.json();if(!r.ok)throw Error(d.error||"Could not start translation");poll=setInterval(async()=>{try{const s=await fetch("/status/"+job).then(x=>x.json());if(s.progress!=null)bar.style.width=Math.min(100,s.progress)+"%";if(s.state==="translating"||s.state==="queued"){status.textContent="Translating… "+(s.progress||0)+"%";return}clearInterval(poll);if(s.state==="complete"){bar.style.width="100%";status.textContent="✓ Translation complete";downloads.innerHTML='<a href="'+s.pdf+'"><button class="primary">Download Telugu PDF</button></a><a href="'+s.docx+'"><button class="secondary">Download DOCX</button></a>'}else{status.textContent=s.error||"Translation failed";translate.disabled=false}}catch(e){clearInterval(poll);status.textContent="Status check failed: "+e.message;translate.disabled=false}},3000)}catch(e){status.textContent=e.message;translate.disabled=false}};</script></body></html>
