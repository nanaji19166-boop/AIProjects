<!doctype html><html lang='en'><head><meta name='viewport' content='width=device-width,initial-scale=1'><title>TeluguSetu</title><style>body{font-family:system-ui;background:#f5f7fb;margin:0;color:#172033}main{max-width:680px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001}.drop{border:2px dashed #7b8190;border-radius:16px;padding:42px 15px;text-align:center}button{width:100%;padding:14px;border:0;border-radius:12px;margin-top:14px;font-size:16px}.primary{background:#182230;color:white}.secondary{background:#e9edf3}.hidden{display:none}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}</style></head><body><main><div class='card'><h1>🇮🇳 TeluguSetu</h1><p>English PDF → Telugu PDF/DOCX</p><div class='drop' id='drop'>Tap to select PDF<input id='file' type='file' accept='.pdf' hidden></div><button class='primary' id='analyze'>Analyze PDF</button><section id='result' class='hidden'><h3>Analysis</h3><div id='stats'></div><button class='primary' id='translate'>Translate to Telugu</button><button class='secondary hidden' id='cancel'>Cancel</button><div id='status'></div><div id='downloads'></div></section></div></main><script>let selected=null,job=null,cancelled=false;const file=document.querySelector('#file'),drop=document.querySelector('#drop'),result=document.querySelector('#result'),stats=document.querySelector('#stats'),status=document.querySelector('#status'),translate=document.querySelector('#translate'),cancel=document.querySelector('#cancel'),downloads=document.querySelector('#downloads');drop.onclick=()=>file.click();file.onchange=()=>{selected=file.files[0];drop.textContent=selected?selected.name:'Tap to select PDF'};document.querySelector('#analyze').onclick=async()=>{if(!selected)return alert('Select a PDF first.');const fd=new FormData();fd.append('file',selected);status.textContent='Analyzing…';const r=await fetch('/analyze',{method:'POST',body:fd}),d=await r.json();if(!r.ok){status.textContent=d.error||'Analysis failed';return}job=d.job_id;stats.innerHTML=Object.entries(d).filter(([k])=>k!=='job_id').map(([k,v])=>'<div class="stat"><b>'+k+'</b><span>'+v+'</span></div>').join('');result.classList.remove('hidden');status.textContent='Analysis complete.'};translate.onclick=async()=>{cancelled=false;translate.disabled=true;cancel.classList.remove('hidden');status.textContent='Translating locally… Please keep this page open.';const fd=new FormData();fd.append('job_id',job);try{const r=await fetch('/translate',{method:'POST',body:fd}),d=await r.json();if(cancelled)return;if(!r.ok){status.textContent=d.error||'Translation failed';return}status.textContent='✓ Translation complete';downloads.innerHTML='<a href="'+d.pdf+'"><button class="primary">Download PDF</button></a><a href="'+d.docx+'"><button class="secondary">Download DOCX</button></a>'}catch(e){status.textContent='Translation failed: '+e.message}finally{translate.disabled=false;cancel.classList.add('hidden')}};cancel.onclick=()=>{cancelled=true;status.textContent='Cancellation requested.'};</script></body></html>
