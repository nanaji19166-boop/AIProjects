name: Build TeluguSetu APK

on:
  push:
    paths:
      - 'telugusetu-mobile/**'
      - '.github/workflows/build-telugusetu-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: telugusetu-mobile
        run: npm install
      - name: Build web app
        working-directory: telugusetu-mobile
        run: npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Capacitor Android project
        working-directory: telugusetu-mobile
        run: npx cap add android
      - name: Copy web assets
        working-directory: telugusetu-mobile
        run: npx cap copy android
      - name: Build debug APK
        working-directory: telugusetu-mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguSetu-debug-apk
          path: telugusetu-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telugusetu-mobile-latest
          name: TeluguSetu Mobile Latest
          prerelease: true
          files: telugusetu-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Latest TeluguSetu Android debug APK. Install directly on Android; Play Store is not required.
            Translation runs locally on the device. The model is downloaded on first use.
