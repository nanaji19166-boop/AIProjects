name: Build TeluguSetu APK

on:
  push:
    paths:
      - 'telugusetu-mobile/**'
      - '.github/workflows/build-telugusetu-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        working-directory: telugusetu-mobile
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor CLI
        working-directory: telugusetu-mobile
        run: npx cap --version

      - name: Run mobile preflight tests
        working-directory: telugusetu-mobile
        run: npm run preflight

      - name: Bundle Noto Sans Telugu fonts
        working-directory: telugusetu-mobile
        run: |
          mkdir -p public/fonts
          curl -fL --retry 3 --retry-delay 2 -o public/fonts/NotoSansTelugu-Regular.ttf https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansTelugu/NotoSansTelugu-Regular.ttf
          curl -fL --retry 3 --retry-delay 2 -o public/fonts/NotoSansTelugu-Bold.ttf https://raw.githubusercontent.com/notofonts/noto-fonts/main/hinted/ttf/NotoSansTelugu/NotoSansTelugu-Bold.ttf
          test -s public/fonts/NotoSansTelugu-Regular.ttf
          test -s public/fonts/NotoSansTelugu-Bold.ttf
          ls -lh public/fonts

      - name: Build web app
        working-directory: telugusetu-mobile
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create Capacitor Android project
        working-directory: telugusetu-mobile
        run: npx cap add android

      - name: Sync Capacitor Android project
        working-directory: telugusetu-mobile
        run: npx cap sync android

      - name: Verify Gradle environment
        working-directory: telugusetu-mobile/android
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: telugusetu-mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: telugusetu-mobile/android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguSetu-debug-apk
          path: telugusetu-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telugusetu-mobile-latest
          name: TeluguSetu Mobile Latest
          prerelease: true
          files: telugusetu-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Latest TeluguSetu Android debug APK. Install directly on Android; Play Store is not required.
            Translation runs locally on the device. The model is downloaded on first use.
